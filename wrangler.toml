# Cloudflare Workers 配置（静态资源模式）
#
# 这个项目是一个单文件静态应用：所有逻辑都在「光影相框.html」里，
# 没有服务端代码，所以不需要 main 入口，只托管 dist/ 下的静态资源。
# Cloudflare 官方明确说明：assets-only Worker 的 main 是可选的。
#
# 本地预览：node build.mjs && npx wrangler dev
# 线上部署：node build.mjs && npx wrangler deploy

name = "guangying-frame"
compatibility_date = "2026-10-01"

[assets]
# build.mjs 会把「光影相框.html」复制成 dist/index.html，
# 并把根目录的 _headers 一起复制进 dist/，所以这里指向 dist
directory = "./dist"

# 单文件应用没有客户端路由，未匹配的路径直接返回 404，不做 SPA 兜底。
# 想改成 SPA 兜底就换成 "single-page-application"
not_found_handling = "none"

# ---------------------------------------------------------------
# 可选：绑定自定义域名
# 先在 Cloudflare 里把这个域名接入（NS 指向 CF），再取消注释后重新 deploy
#
# [[routes]]
# pattern = "frame.your-domain.com"
# custom_domain = true
# ---------------------------------------------------------------
